<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <nav class="side">
    <h2>로그인</h2>
    <a href="signup.html" class="on">회원가입</a>
    <a href="login.html">로그인</a>
  </nav>

  <main class="main">
    <h1>회원가입<small>회원가입 후 다양한 서비스를 이용하세요.</small></h1>

    <div class="steps">
      <div><b>step01</b>약관 동의</div>
      <div><b>step02</b>본인확인</div>
      <div class="on"><b>step03</b>회원정보입력</div>
      <div><b>step04</b>회원가입 완료</div>
    </div>

    <form id="signup" novalidate>
      <p class="sec">기본정보 <small><span class="req"></span> 표시된 항목은 반드시 입력해 주세요.</small></p>
      <table>
        <tr>
          <th class="req">아이디</th>
          <td colspan="3">
            <div class="row"><input type="text" id="uid" maxlength="20" autocomplete="username"><button type="button" class="btn-s" id="dup">중복검색</button></div>
            <p class="hint" id="uidMsg">* 6자이상 20자이하 영문(소문자)/숫자 조합으로 작성, * 한글 아이디 사용불가</p>
          </td>
        </tr>
        <tr>
          <th class="req">비밀번호</th>
          <td><input type="password" id="pw" autocomplete="new-password"><p class="hint">* 영문/숫자/특수문자(!@#$%^&amp;*) 조합 6자리 이상</p></td>
          <th class="req">비밀번호 확인</th>
          <td><input type="password" id="pw2" autocomplete="new-password"><p class="hint">* 비밀번호를 한 번 더 입력</p></td>
        </tr>
        <tr>
          <th class="req">비밀번호 힌트</th>
          <td><select id="hintQ"><option>가장 기억에 남는 장소는?</option><option>나의 보물 1호는?</option><option>첫 번째 애완동물 이름은?</option></select></td>
          <th class="req">비밀번호 답변</th>
          <td><input type="text" id="hintA"></td>
        </tr>
        <tr>
          <th class="req">성명</th>
          <td><input type="text" id="name" autocomplete="name"></td>
          <th class="req">성별</th>
          <td><label class="r"><input type="radio" name="gender" value="남자" checked> 남자</label><label><input type="radio" name="gender" value="여자"> 여자</label></td>
        </tr>
        <tr>
          <th class="req">생년월일</th>
          <td colspan="3"><input type="date" id="birth"><div><label class="r"><input type="radio" name="cal" value="양력" checked> 양력</label><label><input type="radio" name="cal" value="음력"> 음력</label></div></td>
        </tr>
        <tr>
          <th>전화번호</th>
          <td><div class="row"><input type="tel" class="s" id="t1" maxlength="4"> - <input type="tel" class="s" id="t2" maxlength="4"> - <input type="tel" class="s" id="t3" maxlength="4"></div></td>
          <th class="req">핸드폰번호</th>
          <td><div class="row"><input type="tel" class="s" id="m1" maxlength="3" placeholder="010"> - <input type="tel" class="s" id="m2" maxlength="4"> - <input type="tel" class="s" id="m3" maxlength="4"></div></td>
        </tr>
        <tr>
          <th class="req">이메일</th>
          <td colspan="3"><div class="row"><input type="text" id="mail1" style="width:120px"> @ <input type="text" id="mail2" style="width:120px">
            <select id="mailSel" style="width:120px"><option value="">직접 입력</option><option>gmail.com</option><option>naver.com</option><option>daum.net</option><option>kakao.com</option></select></div></td>
        </tr>
        <tr>
          <th>주소</th>
          <td colspan="3">
            <div class="row"><input type="text" id="zip" placeholder="우편번호" maxlength="5" style="width:90px"><button type="button" class="btn-s btn-r" id="zipBtn">주소검색</button></div>
            <input type="text" class="w" id="addr" placeholder="상세 주소" style="margin-top:4px">
          </td>
        </tr>
      </table>
      <button class="submit">회원가입</button>
      <p class="msg" id="msg"></p>
    </form>
  </main>
</div>
<script src="auth.js"></script>
</body>
</html>
